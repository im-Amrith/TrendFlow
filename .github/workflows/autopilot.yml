name: Autopilot (6 PM IST)

on:
  schedule:
    # Once a day at 18:00 IST. GitHub cron runs in UTC (IST = UTC+5:30), so 12:30 UTC.
    # Scheduled runs are best-effort: GitHub can start them late, and occasionally skips one.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, don't publish)"
        type: boolean
        default: true

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run autopilot
        env:
          PYTHONIOENCODING: utf-8
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUTOPILOT_USER_ID: ${{ secrets.AUTOPILOT_USER_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: >-
          python backend/autopilot.py
          ${{ github.event_name == 'schedule' && '--skip-if-posted-within 12' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save generated post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-post
          path: autopilot_output/
          if-no-files-found: ignore
          retention-days: 14
