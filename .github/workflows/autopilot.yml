name: Autopilot (6 AM & 6 PM IST)

on:
  schedule:
    # GitHub cron runs in UTC. IST = UTC+5:30
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 12 * * *"  # 18:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, don't publish)"
        type: boolean
        default: true

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run autopilot
        env:
          PYTHONIOENCODING: utf-8
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUTOPILOT_USER_ID: ${{ secrets.AUTOPILOT_USER_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python backend/autopilot.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
